<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Home | Solo Central</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link href="https://fonts.googleapis.com/css2?family=Parkinsans:wght@300;400;600;700&display=swap" rel="stylesheet" />
		<style>
			* { margin: 0; padding: 0; box-sizing: border-box; }
			body {
				background: #000;
				height: 100vh;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				overflow: hidden;
				font-family: 'Parkinsans', sans-serif;
			}
			#particles-js {
				position: fixed;
				inset: 0;
				z-index: 0;
			}
			.banner {
				position: relative;
				z-index: 1;
				flex-shrink: 0;
				width: 100%;
				display: flex;
				justify-content: center;
			}
			.banner img {
				height: auto;
				display: block;
				pointer-events: none;
				user-select: none;
				max-width: 400px;
			}
.status {
				position: relative;
				z-index: 1;
				display: flex;
				align-items: center;
				gap: 0.75rem;
				color: #b1b1b3;
				font-size: 1.5rem;
				font-weight: 300;
				white-space: nowrap;
				letter-spacing: 0.01em;
				margin-top: 4rem;
				flex-shrink: 0;
			}
			.bullet { color: #e6398d; }
		</style>
	</head>
	<body>
		<div id="particles-js"></div>
		<div class="banner">
			<img src="/stuff/logo-text.png" alt="" />
		</div>
		<div class="status">
			<span id="clock"></span>
			<span class="bullet">•</span>
			<span id="temp">--</span>
		</div>
		<script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
		<script src="particles.js"></script>
		<script>
		(function () {
			function tick() {
				const now = new Date();
				document.getElementById('clock').textContent = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
			}
			tick();
			setInterval(tick, 1000);

			fetch('https://ipapi.co/json/')
				.then(function (r) { return r.json(); })
				.then(function (geo) {
					return fetch('https://api.open-meteo.com/v1/forecast?latitude=' + geo.latitude + '&longitude=' + geo.longitude + '&current_weather=true&temperature_unit=fahrenheit');
				})
				.then(function (r) { return r.json(); })
				.then(function (data) {
					document.getElementById('temp').textContent = Math.round(data.current_weather.temperature) + '°F';
				})
				.catch(function () {});

			window.parent.postMessage({ type: 'title', value: 'solo central v7' }, '*');
		})();
		</script>
	</body>
</html>
