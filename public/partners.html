<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Partners | Solo Central</title>
		<link rel="stylesheet" href="page.css" />
	</head>
	<body>
		<div id="particles-js"></div>
		<div class="content">
			<h1>partners</h1>
			<div class="grid" id="p-grid"></div>
		</div>
		<script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
		<script src="scparticles.js"></script>
		<script>
		(function () {
			const grid = document.getElementById('p-grid');

			fetch('partners.json')
				.then(function (r) { return r.json(); })
				.then(function (data) {
					if (!data.length) {
						grid.innerHTML = '<div class="empty">no partners yet</div>';
						return;
					}
					data.forEach(function (p) {
						const card = document.createElement('div');
						card.className = 'card';
						const img = document.createElement('img');
						img.src = p.img;
						img.alt = p.alt;
						img.loading = 'lazy';
						img.onerror = function () { this.src = 'data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 180 180%27%3E%3Crect width=%27180%27 height=%27180%27 fill=%27%230d0d0d%27/%3E%3C/svg%3E'; this.onerror = null; };
						const title = document.createElement('div');
						title.className = 'card-title';
						title.textContent = p.alt;
						card.appendChild(img);
						card.appendChild(title);
						card.addEventListener('click', function () {
							window.parent.postMessage({ type: 'navigate', url: p.url }, '*');
						});
						grid.appendChild(card);
					});
				})
				.catch(function () { grid.innerHTML = '<div class="empty">failed to load partners</div>'; });

			window.parent.postMessage({ type: 'title', value: 'Partners | Solo Central' }, '*');
		})();
		</script>
	</body>
</html>
