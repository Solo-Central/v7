<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Classroom</title>
	<link href="https://fonts.googleapis.com/css2?family=Parkinsans:wght@700&display=swap" rel="stylesheet" />
	<style>
		* { margin: 0; padding: 0; box-sizing: border-box; }
		html, body {
			width: 100%;
			height: 100%;
			background: #000;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			gap: 1.5rem;
		}
		.tagline {
			color: #fff;
			font-family: 'Parkinsans', sans-serif;
			font-weight: 700;
			font-size: 2rem;
			user-select: none;
			letter-spacing: 0.01em;
		}
		.buttons {
			display: flex;
			gap: 2rem;
			align-items: center;
		}
		.img-wrap { cursor: pointer; }
		.img-wrap {
			position: relative;
			width: 220px;
			max-width: 60vw;
			transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
		}
		.img-wrap:hover {
			transform: scale(1.08) rotate(-4deg);
		}
		.img-wrap img {
			width: 100%;
			display: block;
			user-select: none;
			position: absolute;
			top: 0;
			left: 0;
			transition: opacity 0.35s ease;
		}
		.img-wrap img.normal { opacity: 1; }
		.img-wrap img.hovered { opacity: 0; }
		.img-wrap:hover img.normal { opacity: 0; }
		.img-wrap:hover img.hovered { opacity: 1; }
		.img-wrap img:last-child { position: relative; }
	</style>
</head>
<body>
	<p class="tagline">discord.gg/unblockings for more links!</p>
	<div class="buttons">
		<div class="img-wrap">
			<img class="hovered" src="/stuff/hovered.png" alt="" />
			<img class="normal" src="/stuff/play.png" alt="" />
		</div>
		<div class="img-wrap">
			<img class="hovered" src="/stuff/joinhovered.png" alt="" />
			<img class="normal" src="/stuff/join.png" alt="" />
		</div>
	</div>
	<script>
		var btns = document.querySelectorAll('.img-wrap');

		btns[0].addEventListener('click', function () {
			var w = window.open();
			w.document.write('<style>*{margin:0;padding:0;overflow:hidden}iframe{position:fixed;inset:0;width:100%;height:100%;border:none}</style><iframe src="' + location.origin + '/brs.html"></iframe>');
			w.document.close();
		});

		btns[1].addEventListener('click', function () {
			window.open('https://discord.gg/unblockings', '_blank');
		});
	</script>
</body>
</html>
