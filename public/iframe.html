<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Game | Solo Central</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
		<link rel="stylesheet" href="stuff/scicons.css" />
		<style>
			* { margin: 0; padding: 0; box-sizing: border-box; }
			body { display: flex; flex-direction: column; height: 100vh; background: #000; overflow: hidden; }
			.ctrl-bar {
				height: 40px;
				background: #000;
				border-bottom: 1px solid #1a56db;
				display: flex;
				align-items: center;
				padding: 0 0.25rem;
				gap: 0.125rem;
				flex-shrink: 0;
			}
			.ctrl-btn {
				background: none;
				border: none;
				color: #b1b1b3;
				cursor: pointer;
				padding: 0.375rem;
				border-radius: 0.375rem;
				transition: color 0.2s, background 0.2s;
				display: flex;
				align-items: center;
			}
			.ctrl-btn:hover { color: #f9f9fa; background: #1d1d1d; }
			.ctrl-btn .sci { font-size: 1rem; }
			.ctrl-title {
				flex: 1;
				color: #b1b1b3;
				font-family: 'Inter', sans-serif;
				font-size: 0.8rem;
				padding: 0 0.5rem;
				white-space: nowrap;
				overflow: hidden;
				text-overflow: ellipsis;
			}
			#game-frame { flex: 1; border: none; width: 100%; }
		</style>
	</head>
	<body>
		<div class="ctrl-bar">
			<button class="ctrl-btn" id="btn-back" title="Back">
				<i class="sci sci-arrow-left"></i>
			</button>
			<span class="ctrl-title" id="game-title"></span>
			<button class="ctrl-btn" id="btn-refresh" title="Refresh">
				<i class="sci sci-refresh"></i>
			</button>
			<button class="ctrl-btn" id="btn-fullscreen" title="Fullscreen">
				<i class="sci sci-expand"></i>
			</button>
		</div>
		<iframe id="game-frame" allowfullscreen allow="fullscreen *"></iframe>
		<script>
		(function () {
			const params = new URLSearchParams(location.search);
			const url = params.get('url') || '';
			const title = params.get('title') || '';
			const frame = document.getElementById('game-frame');

			document.getElementById('game-title').textContent = title;
			if (url) frame.src = url;
			window.parent.postMessage({ type: 'title', value: title || 'Game' }, '*');

			document.getElementById('btn-back').addEventListener('click', function () {
				history.back();
			});
			document.getElementById('btn-refresh').addEventListener('click', function () {
				try { frame.contentWindow.location.reload(); } catch (e) { frame.src = frame.src; }
			});
			document.getElementById('btn-fullscreen').addEventListener('click', function () {
				try { frame.requestFullscreen(); } catch (e) {}
			});
		})();
		</script>
	</body>
</html>
