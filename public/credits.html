<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Credits | Solo Central</title>
		<link rel="stylesheet" href="page.css" />
		<style>
			details {
				border: 1px solid rgba(26, 86, 219, 0.3);
				border-radius: 0.5rem;
				padding: 0.875rem 1rem;
				background: rgba(26, 86, 219, 0.04);
				margin-bottom: 0.5rem;
				transition: background 0.2s;
			}
			details:hover { background: rgba(26, 86, 219, 0.08); }
			summary {
				display: flex;
				align-items: center;
				gap: 0.75rem;
				cursor: pointer;
				list-style: none;
				flex-wrap: wrap;
			}
			summary::-webkit-details-marker { display: none; }
			.credit-name { flex: 1; font-size: 0.9rem; }
			.credit-link { color: #1a56db; font-size: 0.8rem; text-decoration: none; }
			.credit-link:hover { text-decoration: underline; }
			.credit-tag {
				color: #b1b1b3;
				font-size: 0.75rem;
				border: 1px solid #333;
				border-radius: 0.25rem;
				padding: 0.1rem 0.4rem;
			}
			details pre {
				margin-top: 0.875rem;
				font-size: 0.7rem;
				color: #b1b1b3;
				white-space: pre-wrap;
				word-break: break-word;
				font-family: monospace;
				line-height: 1.6;
			}
		</style>
	</head>
	<body>
		<div id="particles-js"></div>
		<div class="content">
			<h1>credits</h1>
			<h2>qatual - made the whole site</h2>
			<h2>mercury workshop - made scramjet, the proxy backend</h2>
			<h2>krasify - js and css help</h2>
		<script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
		<script src="scparticles.js"></script>
		<script>
			window.parent.postMessage({ type: 'title', value: 'Credits | Solo Central' }, '*');
		</script>
	</body>
</html>
