<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Credits | Solo Central</title>
		<script src="theme.js"></script>
		<link rel="stylesheet" href="page.css" />
	</head>
	<body>
		<div id="particles-js"></div>
		<div class="content">
			<h1>credits</h1>
			<input class="search-bar" id="search" type="text" placeholder="search people..." autocomplete="off" spellcheck="false" />
			<div class="grid" id="a-grid"></div>
		</div>
		<script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
		<script src="scparticles.js"></script>
		<script>
		(function () {
			const grid = document.getElementById('a-grid');
			const search = document.getElementById('search');
			let apps = [];

			function render(list) {
				grid.innerHTML = '';
				if (!list.length) {
					grid.innerHTML = '<div class="empty">no credits found</div>';
					return;
				}
				list.forEach(function (a) {
					const card = document.createElement('div');
					card.className = 'card';
					const img = document.createElement('img');
					img.src = a.img;
					img.alt = a.alt;
					img.loading = 'lazy';
					img.onerror = function () { this.src = 'data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 160 130%27%3E%3Crect width=%27160%27 height=%27130%27 fill=%27%230a0a0a%27/%3E%3C/svg%3E'; this.onerror = null; };
					const info = document.createElement('div');
					info.className = 'card-info';
					const title = document.createElement('div');
					title.className = 'card-title';
					title.textContent = a.alt;
					info.appendChild(title);
					if (a.desc) {
						const desc = document.createElement('div');
						desc.className = 'card-desc';
						desc.textContent = a.desc;
						info.appendChild(desc);
					}
					card.appendChild(img);
					card.appendChild(info);
					card.addEventListener('click', function () {
						window.parent.postMessage({ type: 'navigate', url: a.url }, '*');
					});
					grid.appendChild(card);
				});
			}

			search.addEventListener('input', function () {
				const q = search.value.trim().toLowerCase();
				render(q ? apps.filter(function (a) { return a.alt.toLowerCase().includes(q); }) : apps);
			});

			fetch('cred.json')
				.then(function (r) { return r.json(); })
				.then(function (data) { apps = data; render(apps); })
				.catch(function () { grid.innerHTML = '<div class="empty">failed to load apps</div>'; });

			window.parent.postMessage({ type: 'title', value: 'Credits | Solo Central' }, '*');
		})();
		</script>
	</body>
</html>
