<!DOCTYPE html>
<html lang="en">
<head>
  <base href="https://cdn.jsdelivr.net/gh/Solo-Central/webport@main/the-powder-toy/"/>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>powdering it</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=IM+Fell+English&display=swap');

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #000;
    }

    #canvas {
      display: block;
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      z-index: 0;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    #canvas.ready {
      opacity: 1;
      z-index: 200;
    }

    #loader {
      position: fixed;
      top: 40px; left: 0; right: 0;
      display: flex;
      justify-content: center;
      z-index: 100;
      transition: opacity 0.8s ease, visibility 0.8s ease;
    }
    #loader.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    #status-text {
      font-family: 'IM Fell English', serif;
      font-size: 3rem;
      color: #fff;
    }
  </style>
</head>
<body>

<div id="loader">
  <span id="status-text">port by aubree.lat | LOADING...</span>
</div>

<canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>

<script>
(function () {
  var _W = window.Worker;
  window.Worker = function (url, opts) {
    if (typeof url === 'string' && url.indexOf(location.origin) !== 0) {
      var blob = new Blob(['importScripts(' + JSON.stringify(url) + ')'], { type: 'application/javascript' });
      url = URL.createObjectURL(blob);
    }
    return new _W(url, opts);
  };
  window.Worker.prototype = _W.prototype;
})();

if ('serviceWorker' in navigator && !self.crossOriginIsolated) {
  navigator.serviceWorker.register(new URL('./coi-sw.js', location.href).href).then(function (reg) {
    if (reg.installing) {
      reg.installing.addEventListener('statechange', function (e) {
        if (e.target.state === 'activated') location.reload();
      });
    }
  });
}
</script>
<script>
var _statEl  = document.getElementById('status-text');
var _loader  = document.getElementById('loader');
var _canvas  = document.getElementById('canvas');
var _gameReady = false;
var _loadedMB  = 0;
var _totalMB   = 0;

function setStatus(loadedMB, totalMB) {
  if (totalMB > 0 && loadedMB <= totalMB) {
    _statEl.textContent = 'port by aubree.lat | LOADING... ' + loadedMB.toFixed(2) + 'MB/' + totalMB.toFixed(2) + 'MB';
  } else if (loadedMB > 0) {
    _statEl.textContent = 'port by aubree.lat | LOADING... ' + loadedMB.toFixed(2) + 'MB';
  } else {
    _statEl.textContent = 'port by aubree.lat | LOADING...';
  }
}

function dismissLoader() {
  _canvas.style.cssText = 'display:block;position:fixed;top:0;left:0;width:100vw;height:100vh;z-index:200;opacity:1;';
  _loader.classList.add('hidden');
}

function onReady() {
  if (_gameReady) return;
  _gameReady = true;
  dismissLoader();
}

(function () {
  var orig = window.fetch.bind(window);
  window.fetch = function (input, init) {
    var url = typeof input === 'string' ? input : (input.url || String(input));
    if (url.indexOf('.wasm') !== -1) {
      return orig(input, init).then(function (res) {
        if (!res.ok) return res;
        var total  = parseInt(res.headers.get('Content-Length') || '0', 10) || null;
        var loaded = 0;
        _totalMB = total ? total / 1048576 : 0;
        var reader = res.body.getReader();
        var stream = new ReadableStream({
          start: function (ctrl) {
            function pump() {
              reader.read().then(function (r) {
                if (r.done) { ctrl.close(); return; }
                loaded += r.value.byteLength;
                _loadedMB = loaded / 1048576;
                setStatus(_loadedMB, _totalMB);
                ctrl.enqueue(r.value);
                pump();
              }).catch(function (e) { ctrl.error(e); });
            }
            pump();
          }
        });
        return new Response(stream, { headers: res.headers, status: res.status, statusText: res.statusText });
      });
    }
    return orig(input, init);
  };
})();

window.onerror = function (msg) {
  _statEl.textContent = 'ERROR: ' + msg;
};

window.addEventListener('unhandledrejection', function (e) {
  _statEl.textContent = 'ERROR: ' + e.reason;
});

(function () {
  var s = document.createElement('script');
  s.src = 'powder.js';
  s.onerror = function () {
    _statEl.textContent = 'ERROR: powder.js failed to load';
  };
  s.onload = function () {
    if (typeof create_powder !== 'function') {
      _statEl.textContent = 'ERROR: create_powder() not found';
      return;
    }

    create_powder({
      canvas: _canvas,
      print:    function () {},
      printErr: function () {},
      setStatus: function (text) { if (!text) onReady(); },
      monitorRunDependencies: function (left) { if (left === 0) onReady(); },
      onRuntimeInitialized: function () { onReady(); }
    }).then(function () {
      onReady();
    }).catch(function (e) {
      _statEl.textContent = 'ERROR: ' + e;
    });
  };
  document.body.appendChild(s);
})();
</script>
</body>
</html>
